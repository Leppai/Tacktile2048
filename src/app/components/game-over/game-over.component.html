<div class="overlay-container">

  <!-- SCORE -->
  <div class="score-section">

    <div class="left-section">

        <p class="score-label">
          SCORE
        </p>

        <h1 class="score-value">
          {{ score }}
        </h1>


    </div>


    <div class="right-section">

      <div class="best-score-card">

          <p class="best-label">
            BEST SCORE
          </p>

          <p class="best-value">
            {{ bestScore }}
          </p>

      </div>


    </div>

  </div>



  <!-- CARD -->
  <ion-card class="gameover-card">

    <div class="card-content">

      <h2 class="gameover-title">
        Game Over!
      </h2>

      <p class="gameover-desc">
        No more moves left. You reached the 256 tile!
      </p>


      <!-- RETRY -->
      <ion-button
        expand="block"
        class="retry-btn"
        (click)="retry.emit()"
      >
        <ion-icon
          slot="start"
          name="refresh-outline">
        </ion-icon>

        Try Again
      </ion-button>



      <!-- SHARE -->
      <ion-button
        expand="block"
        fill="outline"
        class="share-btn"
        (click)="goHome()"
      >
        <ion-icon
          slot="start"
          name="home">
        </ion-icon>

        Home
      </ion-button>


    </div>

  </ion-card>



  <!-- MERGE INFO -->
  <ion-card class="merge-card">

    <p class="merge-label">
      TILES MERGED
    </p>

    <h3 class="merge-value">
      {{ totalMerge }}
    </h3>

    <p class="merge-desc">
      Total merges
    </p>

  </ion-card>



</div>
