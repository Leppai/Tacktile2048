<!-- HEADER -->
<ion-header class="ion-no-border">
  <ion-toolbar>

    <ion-buttons slot="start">

      <ion-back-button defaultHref="/home">
      </ion-back-button>

    </ion-buttons>

    <ion-title class="title-center">
      Settings
    </ion-title>

  </ion-toolbar>
</ion-header>



<!-- CONTENT -->
<ion-content fullscreen>

  <div class="settings-container">

    <!-- THEME -->
    <ion-card
      class="settings-card clickable"
      (click)="openThemeSettings()">

      <div class="settings-item">

        <div class="item-left">

          <div class="icon-circle theme-icon">
            <ion-icon name="color-palette-outline"></ion-icon>
          </div>

          <p class="item-title">
            Theme
          </p>

        </div>

        <div class="theme-right">

          <span class="current-theme">
            {{ currentTheme | titlecase }}
          </span>

          <ion-icon name="chevron-forward-outline"></ion-icon>

        </div>

      </div>

    </ion-card>

    <ion-card class="settings-card">

      <div class="settings-row">

        <div class="icon-circle">
          <ion-icon name="volume-high-outline"></ion-icon>
        </div>

        <ion-toggle [checked]="sound" (ionChange)="toggleSound($event)"></ion-toggle>

      </div>

      <div class="settings-text">
        <h3 class="settings-title">
          Sound Effects
        </h3>

      </div>

    </ion-card>



    <!-- HOW TO PLAY -->
    <ion-card class="settings-card clickable" (click)="openHowToPlay()">

      <div class="settings-item">

        <p class="item-title">
          How To Play
        </p>

        <ion-icon name="chevron-forward-outline"></ion-icon>

      </div>

    </ion-card>



    <!-- RESET -->
    <ion-card class="settings-card clickable" (click)="resetProgress()">

      <div class="settings-item">

        <p class="item-title">
          Reset Progress
        </p>

        <ion-icon name="chevron-forward-outline"></ion-icon>

      </div>

    </ion-card>



    <!-- POLICY -->
    <ion-card class="settings-card clickable" (click)="openPrivacyPolicy()">

      <div class="settings-item">

        <p class="item-title">
          Privacy Policy
        </p>

        <ion-icon name="chevron-forward-outline"></ion-icon>

      </div>

    </ion-card>



    <!-- VERSION -->
    <p class="version-text">
      VERSION 1.1.0 • TACKTILE2048
    </p>

  </div>

  <app-theme-picker
    *ngIf="showThemePicker"
    class="overlay-layer"
    (close)="closeThemePicker()"
    (themeSelected)="selectTheme($event)">
  </app-theme-picker>

  <app-how-to-play
    *ngIf="showHowToPlay"
    class="overlay-layer"
    (close)="closeHowToPlay()">
  </app-how-to-play>
</ion-content>
